# SPA nginx config for the QuizMateAI FE container (PR9).
# - /assets/* and *.js / *.css / *.webp etc. are cache-busted hashed filenames → cache aggressively.
# - / and unknown paths fall back to /index.html so client-side routing works.
# - /index.html and /config.js are cache:no-store so a redeploy or env-var change picks up
#   immediately instead of being pinned by the browser cache.

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compress text assets in flight. nginx-alpine ships gzip on by default but we set it
    # explicitly because deploy environments differ.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;
    gzip_proxied any;

    # Long cache for hashed asset filenames.
    location ~* \.(?:js|css|woff2?|ttf|webp|png|jpg|jpeg|svg|ico)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # Never cache the entry HTML or runtime config — they're the bytes that change.
    location = /index.html {
        add_header Cache-Control "no-store";
    }
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    # SPA fallback: anything not on disk hits the React app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
