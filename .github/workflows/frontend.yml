name: Deploy Frontend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_WS_URL: ${{ secrets.VITE_WS_URL }}
          VITE_SITE_URL: ${{ secrets.VITE_SITE_URL }}
          VITE_SUPPORT_EMAIL: ${{ secrets.VITE_SUPPORT_EMAIL }}

      - name: Check bundle budget
        run: npm run check:bundle-budget

      - name: Start preview server
        run: npm run preview -- --host 127.0.0.1 --port 4173 &

      - name: Wait for preview server
        run: |
          for i in {1..30}; do
            if curl -sf http://127.0.0.1:4173 > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Preview server did not start in time."
          exit 1

      - name: Run Lighthouse audit
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://127.0.0.1:4173/
            http://127.0.0.1:4173/pricing
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: us-east-1

      # Upload index.html with no-store so browsers always fetch latest after deploy
      - name: Upload index.html (no-cache)
        run: |
          aws s3 cp dist/index.html s3://quizmateai-static/index.html \
            --cache-control "no-store" \
            --content-type "text/html; charset=utf-8"

      # Runtime config served fresh (no-store) so config changes apply without a rebuild
      - name: Upload config.js (no-cache)
        run: |
          if [ -f dist/config.js ]; then
            aws s3 cp dist/config.js s3://quizmateai-static/config.js \
              --cache-control "no-store" \
              --content-type "application/javascript; charset=utf-8"
          fi

      # Upload all hashed assets with long-lived immutable cache
      - name: Upload static assets (immutable cache)
        run: |
          aws s3 sync dist s3://quizmateai-static \
            --exclude "index.html" \
            --exclude "config.js" \
            --cache-control "public, max-age=31536000, immutable" \
            --delete

      # Purge Cloudflare cache so visitors get fresh index.html on next request.
      # CloudFront is replaced by a Cloudflare Worker that proxies to S3.
      - name: Purge Cloudflare cache
        run: |
          curl -fsS -X POST \
            "https://api.cloudflare.com/client/v4/zones/${{ secrets.CF_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'
