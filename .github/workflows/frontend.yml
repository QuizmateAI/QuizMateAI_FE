name: Deploy Frontend

# PR10: split into quality-gate (lint/test/audit) → build/lighthouse → deploy. The deploy step
# is fenced behind a GitHub Environment so prod requires reviewer approval per repo settings
# → Environments → production → Required reviewers.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - Tai
  workflow_dispatch:

jobs:
  # ------------------------------------------------------------------------------------------
  # 1. Quality gate: lint + unit tests + audit. Cheap and fast — fail loud on bad PRs before
  # we burn time on the Lighthouse / build step.
  # ------------------------------------------------------------------------------------------
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Vitest (unit + interceptor + runtime config)
        run: npm test -- --run

      # npm audit fires on CRITICAL/HIGH vulns. Don't fail on moderate/low — those produce too
      # much noise and the team can address them via Dependabot PRs.
      - name: npm audit (high+)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  # ------------------------------------------------------------------------------------------
  # 2. Build + Lighthouse. Runs in PRs too so we catch routing/import/build regressions early.
  # ------------------------------------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    needs: [quality-gate]
    steps:
      - uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_WS_URL: ${{ secrets.VITE_WS_URL }}
          VITE_SITE_URL: ${{ secrets.VITE_SITE_URL }}
          VITE_SUPPORT_EMAIL: ${{ secrets.VITE_SUPPORT_EMAIL }}

      - name: Check bundle budget
        run: npm run check:bundle-budget

      - name: Start preview server
        run: npm run preview -- --host 127.0.0.1 --port 4173 &

      - name: Wait for preview server
        run: |
          for i in {1..30}; do
            if curl -sf http://127.0.0.1:4173 > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Preview server did not start in time."
          exit 1

      - name: Run Lighthouse audit
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://127.0.0.1:4173/
            http://127.0.0.1:4173/pricing
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true

      # Upload dist for the deploy job. Saves a second `npm run build` and guarantees the same
      # bytes that just passed Lighthouse are what ships.
      - name: Upload dist artifact
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  # ------------------------------------------------------------------------------------------
  # 3. Deploy. Fenced behind `environment: production` so prod requires reviewer approval per
  # the repo's environment protection rules.
  # ------------------------------------------------------------------------------------------
  deploy:
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment:
      name: production
      url: https://quizmateai.io.vn
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: us-east-1

      # Upload index.html + config.js with no-store so browsers always pick up the latest
      # bundle hashes and the latest runtime config after a redeploy.
      - name: Upload index.html (no-cache)
        run: |
          aws s3 cp dist/index.html s3://quizmateai-prod/index.html \
            --cache-control "no-store" \
            --content-type "text/html; charset=utf-8"

      - name: Upload config.js (no-cache)
        run: |
          if [ -f dist/config.js ]; then
            aws s3 cp dist/config.js s3://quizmateai-prod/config.js \
              --cache-control "no-store" \
              --content-type "application/javascript; charset=utf-8"
          fi

      # All hashed assets get the long immutable cache. --delete removes stale chunks from S3.
      - name: Upload static assets (immutable cache)
        run: |
          aws s3 sync dist s3://quizmateai-prod \
            --exclude "index.html" \
            --exclude "config.js" \
            --cache-control "public, max-age=31536000, immutable" \
            --delete

      - name: Purge Cloudflare cache
        run: |
          curl -fsS -X POST \
            "https://api.cloudflare.com/client/v4/zones/${{ secrets.CF_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'
