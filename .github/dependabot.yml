# Dependabot keeps npm + GitHub Actions deps fresh so prod isn't sitting on CVE-laden libs
# nobody noticed. Conservative weekly cadence; security updates fire immediately regardless.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - frontend
    groups:
      # React + Vite stay synchronized to avoid the babel/runtime/swc/cjs mismatch traps.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      vite:
        patterns:
          - "vite"
          - "@vitejs/*"
      tanstack:
        patterns:
          - "@tanstack/*"
      radix:
        patterns:
          - "@radix-ui/*"
      i18n:
        patterns:
          - "i18next"
          - "i18next-*"
          - "react-i18next"
      testing:
        patterns:
          - "vitest"
          - "@vitest/*"
          - "@testing-library/*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - ci
